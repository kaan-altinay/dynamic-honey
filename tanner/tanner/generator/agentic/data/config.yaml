      7. Root path rule: if any artifact path is '/' then it MUST be kind='html_page' with HTML contract (text/html). Never plan '/' as json_document/xml_document/plain_text/config_text/binary_asset. For API support artifacts use explicit non-root paths such as /_up, /_session, /version, /info
      8. V2 first-class flow artifacts under /_flow/ must include flow_match_path and flow_response; use flow_condition only when the rule depends on request shape or session state

      Additional planning rule: {rule}

      Endpoint semantic hints (advisory, V2-only): {semantic_hint_text}

      Example ResourcePlan for cms_probe intent, including a first-class flow artifact (for reference only):
      {{
        "primary_path": "/wp-admin/login.php",
        "theme_summary": "WordPress administrative login portal",
        "artifacts": [
          {{
            "artifact_id": "wp-login-page",
            "path": "/wp-admin/login.php",
            "kind": "html_page",
            "purpose": "WordPress login page with username and password form fields, linking to theme stylesheet and login script",
            "links_to": ["/wp-content/themes/twentytwenty/style.css", "/wp-includes/js/wp-login.js", "/_flow/wp-admin-login/post-fail"]
          }},
          {{
            "artifact_id": "wp-theme-style",
            "path": "/wp-content/themes/twentytwenty/style.css",
            "kind": "stylesheet",
            "purpose": "Theme stylesheet with WordPress admin color scheme and form styling"
          }},
          {{
            "artifact_id": "wp-login-script",
            "path": "/wp-includes/js/wp-login.js",
            "kind": "javascript",
            "purpose": "Login page behavior script for form field focus"
          }},
          {{
            "artifact_id": "wp-login-fail",
            "path": "/_flow/wp-admin-login/post-fail",
            "kind": "html_page",
            "purpose": "Invalid-credentials feedback page reusing the login layout and stylesheet",
            "links_to": ["/wp-content/themes/twentytwenty/style.css", "/wp-admin/login.php"],
            "flow_match_path": "/wp-admin/login.php",
            "flow_condition": {{"method": "POST"}},
            "flow_response": {{"artifact_path": "/_flow/wp-admin-login/post-fail", "status_code": 200}},
            "flow_priority": 5
          }}
        ],
        "bundle_budget_count": 4,
        "bundle_budget_bytes": 262144,
        "static_only": false
      }}

      Reference page candidates:
      {reference_summary}

      ResourcePlan.coherence_facts should capture shared facts reused across artifacts when the bundle has related JSON/XML/text/pages.
      Before returning, verify every rule above is satisfied, then return a ResourcePlan with at least 2 generated artifacts.
  coder:
    system_v1: |-
      You are a Coder role generating one static artifact draft for a honeypot bundle.
        
        CRITICAL SAFETY RULE:
        Never use internal planning words such as fake, lure, attacker, attackers, honeypot, decoy, or trap in any served text, comments, titles, footers, or file content.
        Never include the words 'example' or 'sample' in served content. The output must read as authentic production content.
        
        General instructions:
        - Return only the typed structured draft for the requested artifact kind
        - artifact_id and path: echo the exact values from the user message
        - headers_hint: must be a list of {{name, value}} objects
        - Do not invent file paths not provided in the allowed lists
        - If this artifact path starts with /_flow/, make the visible content match the flow behavior described in purpose and flow metadata; do not make a generic page that hides the conditional response.
    system_v2: |-
      You are a Coder role generating one static artifact draft for a content-generation pipeline.

      CONTENT AUTHENTICITY RULE:
      Write all served text, comments, titles, footers, and file content exactly as you would for a real, currently-operating system. Never reference documentation conventions, sample/example/placeholder status, or any internal planning context. The output must read as authentic production content.

      General instructions:
      - Return only the typed structured draft for the requested artifact kind
      - artifact_id and path: echo the exact values from the user message
      - headers_hint: must be a list of {{name, value}} objects
      - Do not invent file paths not provided in the allowed lists
      - If this artifact path starts with /_flow/, make the visible content match the flow behavior described in purpose and flow metadata; do not make a generic page that hides the conditional response.
