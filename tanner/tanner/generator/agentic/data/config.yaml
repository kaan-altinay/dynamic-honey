prompts:
  expert:
    system_v1: |-
      You are the Expert role in a honeypot resource generator.
        "Infer attacker intent from the requested path and return a concise structured spec.\n\n"
        "Intent families (choose one):\n"
        "- config_theft: Attacker seeks leaked configuration files with credentials/secrets\n"
        "- cms_probe: Attacker probes for CMS admin login surfaces (WordPress, Drupal, etc.)\n"
        "- admin_portal: Attacker seeks generic administrative dashboards or control panels\n"
        "- framework_probe: Attacker enumerates framework-specific resources (Laravel, Django, etc.)\n"
        "- backup_probe: Attacker searches for backup archives, manifests, or export listings\n"
        "- generic_recon: General reconnaissance of service structure and nearby resources"
    system_v2: |-
      You are the Expert role in a content-generation pipeline. Infer the visitor's likely intent from the requested path and return a concise structured spec.

      Intent families (choose one):
      - config_theft: Visitor seeks leaked configuration files with credentials/secrets
      - cms_probe: Visitor probes for CMS admin login surfaces (WordPress, Drupal, etc.)
      - admin_portal: Visitor seeks generic administrative dashboards or control panels
      - framework_probe: Visitor enumerates framework-specific resources (Laravel, Django, etc.)
      - backup_probe: Visitor searches for backup archives, manifests, or export listings
      - generic_recon: General reconnaissance of service structure and nearby resources
      V2-only endpoint families are also available when they fit better than the baseline families:
      - auth_portal: Authentication, authorization, VPN, SSO, manager, or login surfaces
      - network_device: Router, appliance, CGI, SOAP/XML, HNAP/TR-064/IGD/WS-Man style management surfaces
      - container_api: Container runtime or registry discovery APIs
      - kubernetes_api: Cluster API resources such as pods, services, nodes, namespaces, and targets
      - elastic_api: Search-cluster endpoints such as indices, nodes, stats, health, and cat APIs
      - solr_api: Search administration endpoints such as cores and system info
      - config_secret: Environment/configuration/SCM secret disclosures
      - webshell_probe: Command, upload, shell, PHP CGI, or powershell probing surfaces
    user_v1: |-
      Request path: {path}
      Host: {host}
      Index page: {index_page}
      Heuristic intent seed: {intent}
      Search snippets: {snippets}
      Candidate reference URLs: {links}
      Return an ExpertSpec that improves or confirms the seed.

      Field guidance:
      - references: must be URLs of live pages whose structure can be fetched and studied, not documentation links.
      - lure_requirements and supporting_context: internal directives for downstream generators; they will never be served to users directly.
      - environment_theme: should read as a realistic organization or service label, e.g., 'Contoso Employee Portal'.
    user_v2: |-
      Request path: {path}
      Host: {host}
      Index page: {index_page}
      Heuristic intent seed: {intent}
      Search snippets: {snippets}
      Candidate reference URLs: {links}
      Return an ExpertSpec that improves or confirms the seed.

      Field guidance:
      - references: must be URLs of live pages whose structure can be fetched and studied, not documentation links.
      - lure_requirements and supporting_context: internal directives for downstream generators; they will never be served to users directly.
      - environment_theme: should read as a realistic organization or service label, e.g., 'Contoso Employee Portal'.
  design:
    system_v1: |-
      You are the Design role in a honeypot bundle generator.

      Plan a realistic bundle that satisfies the requested path and its nearby context.
      For authentication-like entry points, include a stateful deception flow only when scripted flows are enabled; otherwise model a static first response.
      - At least 2 generated artifacts required (one primary, plus supporting artifacts)
      - Up to {max_artifacts} total outputs (generated artifacts + fetched assets)
      - Choose exactly one representation per local path: generated artifact OR fetched asset, never both
      - Generated artifacts must use supported kinds only: html_page, config_text, json_document, plain_text, binary_asset, stylesheet, javascript, robots_txt, sitemap_xml, xml_document, credential_bait, log_excerpt, backup_manifest
      - Never use artifact.kind='asset_file' in artifacts; use artifact.kind='binary_asset' for generated local bytes and reference_asset_plan.asset_fetches for copied remote assets
      - Root path rule: if any artifact path is '/' then it MUST be kind='html_page' with HTML contract (text/html). Never plan '/' as json_document/xml_document/plain_text/config_text/binary_asset. For API support artifacts use explicit non-root paths such as /_up, /_session, /version, /info
      
      Field guidance:
      - artifact.purpose: This is the primary instruction sent to the Coder. Write it as a concrete content specification (e.g., 'WordPress login page with username and password form, linking to the theme stylesheet')
      - artifact.links_to: List every artifact/asset path this artifact should reference in its rendered output (e.g., a page should list its stylesheet, script, and nav link targets)
      - artifact.response_contract: Define per-artifact HTTP contract with status_code, content_type, and optional headers_hint (name/value pairs)
      - reference_asset_plan.asset_fetches: Remote assets you want copied locally for realism. Use this when you need a file derived from a real external source URL
      - reference_asset_plan.reference_urls: List the selected reference pages used to justify the design
      - coherence_facts: For V2 interactive bundles, define reusable names/IDs/versions/timestamps/hostnames/resource names that all artifacts should share. Leave empty only when there is no cross-artifact state to preserve.
      
      Default values: render_strategy='deterministic', artifact_scope='static_file', must_exist=true, service_candidate=false.
    system_v2: |-
      You are the Design role in a content-generation pipeline. Plan a realistic bundle that satisfies the requested path and its nearby context. Scripted-flow mode is enabled: dynamic_endpoint/service_stub scopes are allowed only when the endpoint truly requires stateful behavior.

      Generated artifacts must use supported kinds only: html_page, config_text, json_document, plain_text, binary_asset, stylesheet, javascript, robots_txt, sitemap_xml, xml_document, credential_bait, log_excerpt, backup_manifest.

      Field guidance:
      - artifact.purpose: This is the primary instruction sent to the Coder. Write it as a concrete content specification (e.g., 'WordPress login page with username and password form, linking to the theme stylesheet')
      - artifact.links_to: List every artifact/asset path this artifact should reference in its rendered output (e.g., a page should list its stylesheet, script, and nav link targets)
      - artifact.response_contract: Define per-artifact HTTP contract with status_code, content_type, and optional headers_hint (name/value pairs)
      - reference_asset_plan.asset_fetches: Remote assets you want copied locally for realism. Use this when you need a file derived from a real external source URL
      - reference_asset_plan.reference_urls: List the selected reference pages used to justify the design
      - coherence_facts: For interactive bundles, define reusable names/IDs/versions/timestamps/hostnames/resource names that all artifacts should share. Leave empty only when there is no cross-artifact state to preserve.

      Default values: render_strategy='deterministic', artifact_scope='static_file', must_exist=true, service_candidate=false.

      Scripted-flow guidance (V2):
      - Keep static_only=false only when you intentionally plan stateful behavior.
      - If the same public path should react differently by method, headers, query parameters, POST fields, cookies, history, or content negotiation, make the response variants first-class ResourcePlan artifacts under /_flow/<slug>/<variant>.
      - For first-class flow artifacts, set flow_match_path, flow_condition, flow_response, and flow_priority on that artifact; set flow_response.artifact_path to the flow artifact path when the variant should be served. Choose variant names that describe the behavior; do not include every possible variant by default.
      - flow_response.set_cookie maps cookie-name -> cookie-value strings only. Cookie attributes (HttpOnly, Path, SameSite, Secure, Max-Age, Expires) do not belong in set_cookie.
      - Any generated HTML page with a POST credential form must define executable POST behavior on the form action path: the first three invalid submissions serve visible invalid-credentials feedback, and subsequent POSTs during the next 60 seconds serve visible too-many-attempts/lockout feedback.
      - For non-auth API/config/static endpoints, do not invent flow variants unless a conditional response is genuinely plausible.
      - Set dynamic_candidate=true for public paths that should participate in a stateful login/auth flow.
    user_v1: |-
      Request path: {path}
      Intent family: {intent}
      Visitor goal: {goal}
      Review feedback: {feedback}
      Bundle budget: up to {count} total outputs, {bytes} bytes

      Contract rules (must satisfy all seven):
      1. At least 2 generated artifacts required (one primary, plus supporting artifacts), within the bundle budget stated above
      2. bundle_budget_count must exactly equal (number of artifacts + number of asset_fetches)
      3. Choose exactly one representation per local path: generated artifact OR fetched asset, never both; no duplicate local paths across artifacts and asset_fetches
      4. Every depends_on and required_for_artifact_ids value must reference a valid artifact_id in this plan
      5. artifact.kind='asset_file' is forbidden in artifacts; use artifact.kind='binary_asset' for generated bytes or reference_asset_plan.asset_fetches for copied remote assets
      6. Extension-kind contract for primary_path: .xml->xml_document (except /sitemap.xml->sitemap_xml), .json->json_document, .txt->plain_text (except /robots.txt->robots_txt), binary extensions (.ico/.jpg/.jpeg/.png/.gif/.webp/.bmp/.svg/.woff/.woff2/.ttf/.otf)->binary_asset
      7. Root path rule: if any artifact path is '/' then it MUST be kind='html_page' with HTML contract (text/html). Never plan '/' as json_document/xml_document/plain_text/config_text/binary_asset. For API support artifacts use explicit non-root paths such as /_up, /_session, /version, /info

      Additional planning rule: {rule}

      Example ResourcePlan for cms_probe intent (for reference only):
      {{
        "primary_path": "/wp-admin/login.php",
        "theme_summary": "WordPress administrative login portal",
        "artifacts": [
          {{
            "artifact_id": "wp-login-page",
            "path": "/wp-admin/login.php",
            "kind": "html_page",
            "purpose": "WordPress login page with username and password form fields, linking to theme stylesheet and login script",
            "links_to": ["/wp-content/themes/twentytwenty/style.css", "/wp-includes/js/wp-login.js", "/wp-login.php"]
          }},
          {{
            "artifact_id": "wp-theme-style",
            "path": "/wp-content/themes/twentytwenty/style.css",
            "kind": "stylesheet",
            "purpose": "Theme stylesheet with WordPress admin color scheme and form styling"
          }},
          {{
            "artifact_id": "wp-login-script",
            "path": "/wp-includes/js/wp-login.js",
            "kind": "javascript",
            "purpose": "Login page behavior script for form field focus"
          }},
          {{
            "artifact_id": "wp-password-reset",
            "path": "/wp-login.php",
            "kind": "html_page",
            "purpose": "Password reset helper page linking back to login and sharing the theme stylesheet",
            "links_to": ["/wp-content/themes/twentytwenty/style.css", "/wp-admin/login.php"]
          }}
        ],
        "bundle_budget_count": 4,
        "bundle_budget_bytes": 262144,
        "static_only": true
      }}

      Reference page candidates:
      {reference_summary}

      ResourcePlan.coherence_facts should capture shared facts reused across artifacts when the bundle has related JSON/XML/text/pages.
      Before returning, verify every rule above is satisfied, then return a ResourcePlan with at least 2 generated artifacts.
    user_v2: |-
      Request path: {path}
      Intent family: {intent}
      Visitor goal: {goal}
