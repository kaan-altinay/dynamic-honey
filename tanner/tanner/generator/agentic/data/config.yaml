      3. MINIMAL_CONFIG: Config files have fewer than 3 entries or use obviously fake values ('changeme', 'password123')
      4. BROKEN_THEME: Content contradicts the environment_theme (e.g., 'WordPress' theme but page says 'Drupal Admin')
      5. INTERNAL_LANGUAGE_LEAK: Text reads like internal planning notes rather than production content for a real system (references to documentation conventions, sample/placeholder status, or meta-commentary about the content's purpose)
      6. FLOW_ARTIFACT_MISMATCH: Scripted-flow variants are generic, invisible to the client, or contradict their trigger (for example lockout without lockout text, invalid-login flow without failure text, or no-auth/session-expired content that looks authenticated)
      7. COHERENCE_MISMATCH: Related JSON/XML/text/page artifacts contradict the supplied coherence_facts or use unrelated names, IDs, versions, timestamps, hosts, or resource labels

      Return 'revise' if you find ANY of these blocking defects. Specify the defect category and affected artifact in required_fixes.
      Return 'approve' for minor style issues, missing CSS polish, or other non-blocking gaps.
      Return 'fallback' only if multiple severe defects make the bundle unusable.
