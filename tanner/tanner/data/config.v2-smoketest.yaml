DATA:
  db_config: /opt/tanner/db/db_config.json
  dorks: /opt/tanner/data/dorks.pickle
  user_dorks: /opt/tanner/data/user_dorks.pickle
  crawler_stats: /opt/tanner/data/crawler_user_agents.txt
  geo_db: /opt/tanner/db/GeoLite2-City.mmdb
  tornado: /opt/tanner/data/tornado.py
  mako: /opt/tanner/data/mako.py

TANNER:
  host: 0.0.0.0
  port: 8090

REDIS:
  host: localhost
  port: 6379
  poolsize: 80
  timeout: 1

GENERATOR:
  backend: agentic
  enable_scripted_flows: true       # V2 — flow_designer node active
  max_review_loops: 1
  max_design_validation_loops: 2
  max_bundle_artifacts: 8           # higher budget for /_flow/ variants
  max_bundle_bytes: 2000000
  checkpoint_path: /tmp/tanner-agentic-v2-smoketest.sqlite
  graph_recursion_limit: 200
  review_log_path: /tmp/tanner-agentic-v2-review-log.json
  enable_live_research: true
  max_tool_response_chars: 4000
  max_command_output_chars: 2000
  command_timeout: 2
  max_concurrent_model_calls: 1
  inter_call_delay_seconds: 12.5
  max_rate_limit_retries: 3
  default_rate_limit_backoff_seconds: 12.0
  max_length_limit_retries: 3
  length_retry_token_increase: 800
  max_length_retry_tokens: 6000
  role_defaults:
    provider: openai
    model: gpt-5.4
    timeout: 120
    max_retries: 1
  roles:
    expert:
      temperature: 0.0
      max_tokens: 1800
    design:
      temperature: 0.0
      max_tokens: 2800
    coder:
      temperature: 0.1
      max_tokens: 1600
    review:
      temperature: 0.0
      max_tokens: 1600
  v2_overrides:
    # Applied automatically whenever enable_scripted_flows=true.
    # Tuned V2 defaults from the parameter sweep — kept in sync with
    # tanner/tanner/data/config.yaml's GENERATOR.v2_overrides; this file
    # always has enable_scripted_flows=true, so these are also this
    # smoketest's effective values.
    max_review_loops: 1
    max_design_validation_loops: 2
    max_bundle_artifacts: 8
    max_bundle_bytes: 2000000
    roles:
      expert:
        temperature: 0.0
        max_tokens: 1800
      design:
        temperature: 0.1
        max_tokens: 2400
      coder:
        temperature: 0.1
        max_tokens: 1600
      review:
        temperature: 0.0
        max_tokens: 1600

EMULATORS:
  root_dir: /opt/tanner

EMULATOR_ENABLED:
  sqli: False
  rfi: True
  lfi: True
  xss: True
  cmd_exec: True
  php_code_injection: True
  php_object_injection: True
  crlf: True
  xxe_injection: True
  template_injection: True

SQLI:
  type: SQLITE
  db_name: tanner_db
  host: 127.0.0.1
  user: root
  password: user_pass

XXE_INJECTION:
  OUT_OF_BAND: False
RFI:
  allow_insecure: False

LOGGER:
  log_debug: /opt/tanner/tanner.log
  log_err: /opt/tanner/tanner.err

MONGO:
  enabled: False
  URI: mongodb://localhost

HPFEEDS:
  enabled: False
  HOST: localhost
  PORT: 10000
  IDENT: ''
  SECRET: ''
  CHANNEL: tanner.events

LOCALLOG:
  enabled: False
  PATH: /tmp/tanner_report.json

CLEANLOG:
  enabled: False

SESSIONS:
  delete_timeout: 300
